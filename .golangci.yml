version: "2"
run:
  issues-exit-code: 1
  tests: true
linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - cyclop
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - staticcheck
    - unparam
    - unused
    - whitespace
    - gocritic
  settings:
    cyclop:
      max-complexity: 10
    govet:
      enable-all: true
      settings:
        shadow:
          strict: true
    gocritic:
      enabled-check:
        - commentedOutCode
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gosec
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(https://github.com/booleanism/surr)
    gofumpt:
      extra:
        group-params: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
