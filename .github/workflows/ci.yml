name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A force-push to a branch makes the previous run's result meaningless, so
# cancel it instead of paying for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go (lint, test, build)
    runs-on: ubuntu-24.04

    # The Go side is not pure Go, and the distro matters more than usual:
    #
    #   hub, subscriptions  link mattn/go-sqlite3 (cgo, but it carries the
    #                       amalgamation, so no system library is needed)
    #   rx                  links haivision/srtgo, which is `#cgo LDFLAGS: -lsrt`
    #   tx                  links go-gst, which needs the GStreamer headers
    #
    # tx is the reason this job runs in a container. go-gst v0.0.2 references
    # C.GstIdStr, a type GStreamer only added in 1.26, and ubuntu-24.04 ships
    # 1.24 -- so on the bare runner the tx module does not type-check ("could
    # not determine what C.GstIdStr refers to") and `make lint` fails before it
    # ever reaches the other four modules. Rather than chase a newer runner
    # distro, run in the same Debian release the deploy images are built on, so
    # CI lints and builds against the same GStreamer those images ship. That
    # closes the "passes in CI, fails in the image" gap instead of papering over
    # it. debian:trixie is GStreamer 1.26.2, libsrt 1.5.4, GLib 2.84.
    #
    # The toolchain is pinned to 1.27.1 rather than the image's newest patch
    # (1.27.2) for a second, unrelated reason: golangci-lint v2.13.2 is built
    # with Go 1.27.0 and cannot read the export data 1.27.2 emits ("cannot
    # decode internal/goarch, export data version 5 is greater than maximum
    # supported version 4"). 1.27.1 is also the highest `go` directive in the
    # repo (rx and tx), so this is the floor, not a downgrade.
    container:
      image: golang:1.27.1-trixie

    steps:
      - uses: actions/checkout@v5
        with:
          # The default shallow clone fetches no tags, so `git describe --tags`
          # would fall back to a bare commit hash and the version baked into
          # the binaries would not be the release tag. Full history makes the
          # build id mean what it says.
          fetch-depth: 0

      # A container job runs as root, but the workspace it mounts is owned by
      # the runner's user (uid 1001), and git >= 2.35.2 refuses to work in a
      # repository it does not own:
      #
      #   fatal: detected dubious ownership in repository at '/__w/surr/surr'
      #
      # That is exit 128, and `go build` runs `git status` to stamp VCS
      # information into every binary, so the build fails with
      # "error obtaining VCS status: exit status 128" -- as does the Makefile's
      # own `git describe` for VERSION. Telling git once that this checkout is
      # trusted fixes all of them.
      #
      # This is invisible on a developer machine running rootless Docker: the
      # host user is mapped to uid 0 inside the container, so the checkout is
      # "owned" by root and git never complains. Only real-root Docker, which is
      # what Actions uses, can reproduce it.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The Makefile redirects GOCACHE and GOLANGCI_LINT_CACHE into .cache, so
      # caching that directory is what actually saves the type-check work;
      # /go/pkg/mod is the module cache, which the image's own Go populates.
      - uses: actions/cache@v5
        with:
          path: |
            .cache
            /go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum', 'go.work', '.golangci.yml') }}
          restore-keys: ${{ runner.os }}-go-

      # No sudo: a container job runs as root already. `make lint` type-checks
      # every module, so libsrt and the GStreamer headers are needed even for
      # the lint step, not just the build.
      - name: Install native dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libsrt-openssl-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.13.2/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.13.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: make lint

      # test-go is the Go half of `make test`; the Python half needs the node
      # venv, which the python job owns.
      - name: Test
        run: make test-go

      - name: Build
        run: make build

      - name: Check the injected build id reaches --version
        run: |
          ./bin/surr-hub --version
          ./bin/surr-hub --version | grep -q "$(git describe --tags --always --dirty)"

  python:
    name: Python (tests, typecheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # PyGObject is a build-from-source dependency (no wheels), and 3.58 wants
      # `girepository-2.0 >= 2.80` -- hence libgirepository-2.0-dev, which only
      # exists on distributions with GLib 2.80 or newer. ubuntu-24.04 has it.
      # The gir1.2-* packages supply the Gst/GstVideo typelibs the node binds
      # through; without them the pipeline tests skip themselves rather than
      # fail, which would quietly halve the coverage.
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libgirepository-2.0-dev \
            libcairo2-dev \
            libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            gir1.2-glib-2.0 \
            gir1.2-gstreamer-1.0 \
            gir1.2-gst-plugins-base-1.0

      # --frozen fails the job when uv.lock disagrees with pyproject.toml, which
      # is the check that keeps the lockfile honest.
      - name: Sync the node environment
        run: uv sync --frozen

      - name: Test
        run: make test-nodes

      - name: Typecheck
        run: make typecheck
