[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surr-nodes"
version = "0.0.0"
description = "surr node runtime: SRT frame ingestion, YOLO analysis, broker RPC"
requires-python = ">=3.12"
# The abstract dependency list. nodes/requirements.txt pins the exact versions
# the working venv was built with; keep the two in step when either changes.
# torch is imported directly (lib/bustle/processing.py) as well as pulled in by
# ultralytics. lap is not declared by ultralytics but model.track() needs it.
dependencies = [
    "PyGObject>=3.50",
    "aio-pika>=10.0",
    "pymongo>=4.10",
    "numpy>=2.0",
    "pandas>=2.2",
    "torch>=2.4",
    "ultralytics>=8.3",
    "lap>=0.5.12",
]

[project.optional-dependencies]
# The type-check gate (make typecheck). Pyright is a wrapper around the npm
# package, so the first run downloads a private Node runtime into the venv.
# PyGObject-stubs supplies the gi.repository stubs; without it pyright cannot
# resolve `gi.repository.Gst` at all. Do NOT add gst-python-stubs here: it
# ships an overrides-only Gst.pyi under the same path and silently clobbers
# the real one, which turns the bindings into unknown-attribute errors.
dev = ["pyright>=1.1.400", "PyGObject-stubs>=2.17"]

[tool.setuptools]
# bustle.py is the entrypoint script, not a module; tests/ is run from this
# directory by `make test-nodes` and is deliberately not installed.
packages = ["core", "lib", "lib.bustle"]

[tool.pyright]
include = ["bustle.py", "core", "lib", "tests"]
exclude = [".venv", "**/__pycache__"]
# Pinning the venv is what makes the third-party imports (aio_pika, pymongo,
# ultralytics, torch, pandas) and the PyGObject-stubs resolvable: pyright does
# not pick up the venv just because it was launched from its own bin/.
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
# "standard" is the level the runtime is actually held to: no implicit Any in
# the protocol code, no unbound variables, no unchecked Optional access. The
# few places where the PyGObject stubs are wrong or silent carry a narrow
# `# pyright: ignore[...]` with a reason rather than being silenced here.
typeCheckingMode = "standard"
# PyGObject and GStreamer are compiled extensions whose stubs come from the
# PyGObject-stubs package, so there is deliberately no Python source behind
# `gi.repository.*` for pyright to fall back to.
reportMissingModuleSource = "none"
