name: Release

# Publishing is the only thing that turns a green tree into something a stranger
# can run. Until this existed the seven images in deploy/ were built from
# whatever tree happened to be checked out, and a stack could come up with four
# different build ids -- `surr-hub version unknown`, `surr-rx 0231136-dirty` and
# so on -- because nothing asserted that the images came from one commit.
#
# So a tag is the only trigger, and the tag name is the build id: it is passed to
# every image as VERSION, which the Makefile's -X main.Version would otherwise
# fill from `git describe`. One tag, seven images, one version string.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp (defaults to the tag; required for a manual run)
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  images:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04

    # One runner per image. The alternative -- a single job building all seven --
    # has to hold the tx Rust stage, the bustle torch wheels and their base
    # layers on one disk at the same time, which is roughly 8 GB before any
    # caching.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hub
            dockerfile: deploy/hub.Dockerfile
          - name: subscriptions
            dockerfile: deploy/subscriptions.Dockerfile
          - name: analytics
            dockerfile: deploy/analytics.Dockerfile
          - name: rx
            dockerfile: deploy/rx.Dockerfile
          - name: tx
            dockerfile: deploy/tx.Dockerfile
          - name: bustle
            dockerfile: deploy/nodes.Dockerfile
          - name: migrate
            dockerfile: deploy/migrate.Dockerfile

    steps:
      - uses: actions/checkout@v5
        with:
          # A shallow clone has no tags, so `git describe` inside the build would
          # fall back to a bare commit hash and the image would name a build that
          # is not the release.
          fetch-depth: 0

      # ghcr.io/<owner>/<repo>/<image>. Namespaced under the repository rather
      # than under the owner so that a fork publishes to its own namespace
      # without editing this file.
      - name: Resolve the image name and version
        id: meta
        run: |
          version="${{ github.event.inputs.version || github.ref_name }}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository }}/${IMAGE}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ matrix.name }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          # The repository root, not deploy/: every module's go.mod carries
          # `replace github.com/booleanism/surr => ../`, so the shared internal/
          # tree has to sit beside the module being built.
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          # Layer cache only. The apt and uv cache mounts inside the Dockerfiles
          # are BuildKit-local, so a cold runner re-downloads them either way --
          # which is why the Dockerfiles keep their own `--mount=type=cache`
          # rather than relying on this.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # The release is only worth publishing if the artifact names the build it came
  # from: a stack whose services report `unknown` cannot be diagnosed from logs,
  # and that is exactly what the first full deployment looked like.
  verify:
    name: the published image names its build
    needs: images
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and run the hub image
        run: |
          version="${{ github.event.inputs.version || github.ref_name }}"
          image="ghcr.io/${{ github.repository }}/hub:${version}"

          docker pull "$image"

          # `--version` replaces CMD, so this runs `surr-hub --version`. The
          # output is "surr-hub version <build id>", so the comparison is on the
          # last field: the prefix is the CLI's, and pinning it here would make
          # the check fail for a cosmetic reason.
          reported=$(docker run --rm "$image" --version)
          echo "image reports: $reported"

          test "$(echo "$reported" | awk '{print $NF}')" = "$version"

  release:
    name: the GitHub release
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          # Idempotent: a re-run on an existing tag must not fail on "release
          # already exists", and must not overwrite notes somebody edited.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists; leaving it alone"
          else
            gh release create "$VERSION" --generate-notes --title "$VERSION" --verify-tag
          fi
